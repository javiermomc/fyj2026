name: Deploy website to FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    environment: website
    runs-on: ubuntu-latest
    env:
      FTP_URL: ${{ secrets.FTP_URL }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_FOLDER: ${{ vars.FTP_FOLDER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare FTP host
        shell: bash
        run: |
          set -euo pipefail
          ftp_host="${FTP_URL#ftp://}"
          ftp_host="${ftp_host#ftps://}"
          echo "FTP_HOST=${ftp_host}" >> "$GITHUB_ENV"

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_FOLDER }}/
          dangerous-clean-slate: true
