name: Deploy website to FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    environment: website
    runs-on: ubuntu-latest
    env:
      FTP_URL: ${{ secrets.FTP_URL }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_FOLDER: ${{ vars.FTP_FOLDER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to FTP
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FTP_URL:-}" || -z "${FTP_USER:-}" || -z "${FTP_PASSWORD:-}" || -z "${FTP_PORT:-}" ]]; then
            echo "Missing FTP configuration."
            exit 1
          fi

          remote_path="${FTP_FOLDER:-/}"

          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_URL}" -e "
            set ftp:ssl-allow no
            set ftp:passive-mode true
            set net:max-retries 3
            mkdir -p ${remote_path}
            cd ${remote_path}
            lcd ./dist
            mirror -R --delete --only-newer --verbose . .
            bye
          "
